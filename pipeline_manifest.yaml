pipeline:
  name: "aiwp-standard"
  version: "1.0"
  protocol:
    name: "HACP"
    version: "1.0"
  execution:
    max_parallel: 2
    trace_id_policy: "per-instance"
    knowledge_write_lock: true
  agent_routing:
    policy: "capability-based"
    agents:
      - name: codex
        capabilities: [implementation, testing, debugging]
        production: true
      - name: cursor
        capabilities: [code_review, refactor, architecture_review]
        production: true
        auth_status: needs_login
        degraded_fallback: "codex.review with degraded_from: cursor"
    rules:
      - stage: S5
        capability: implementation
        agent: codex
      - stage: S6
        capability: testing
        agent: codex
      - stage: S7
        capability: code_review
        agent: cursor
        fallback: "codex.review + degraded_from: cursor"
  stages:
    - id: S1
      name: strategy.context.request
      gateway: chatgpt-strategy-gateway
      description: "读取项目上下文（P0-P3 分级检索）"
      inputs: [project_id]
      outputs: [context_summary]
      verification: "P0 非空或降级警告"
    - id: S2
      name: strategy.plan.generate
      gateway: chatgpt-strategy-gateway
      description: "生成战略计划（内存态，ADR 不落盘）"
      inputs: [goal, project_id]
      outputs: [plan]
      verification: "计划含目标/成功标准"
    - id: S3
      name: strategy.handoff
      gateway: chatgpt-strategy-gateway
      description: "4 支柱验证后转交 hermes-orchestrator"
      inputs: [strategy_id, goal, priorities, success_criteria, constraints]
      outputs: [task_id, forwarded_to]
      verification: "target == hermes-orchestrator（不直连 ai-development-manager）"
    - id: S4
      name: task.decompose
      gateway: ai-development-manager
      description: "任务拆解为子任务 DAG"
      inputs: [goal]
      outputs: [subtasks]
      verification: "子任务可独立验收"
    - id: S5
      name: coding-agent.dispatch
      gateway: coding-agent-gateway
      description: "dispatch Codex 执行（workspace-write, pty）"
      inputs: [repo_path, task_spec]
      outputs: [artifacts, codex_session_id]
      verification: "产物存在 + 测试通过"
    - id: S6
      name: verification
      gateway: coding-agent-gateway
      description: "独立验证（pytest 复跑 + 产物检查）"
      inputs: [artifacts, test_command]
      outputs: [verification_result]
      verification: "pytest 全绿"
    - id: S7
      name: review
      gateway: aiwp-pipeline
      description: "Agent review (read-only): review agent resolves via capability routing (cursor primary, codex.review degraded)"
      inputs: [artifacts, test_result, diff_stats]
      outputs: [review_result]
      verification: "review_result schema valid and quality gate evaluated"
      review:
        read_only: true
        review_agent:
          capability: code_review
          primary: cursor
          degraded: codex.review
    - id: S7b
      name: rework
      gateway: aiwp-pipeline
      description: "Rework loop: FAIL -> return to execution agent (codex), max 3 rounds, then human escalate"
      inputs: [review_result, rework_round]
      outputs: [reworked_artifacts, rework_round]
      verification: "continue through round 3 or escalate to human after round 3"
      rework:
        max_rounds: 3
        escalate: human
    - id: S8
      name: github.pr.lifecycle
      gateway: github-development-gateway
      description: "Git Data API 分支 → REST PR → squash merge"
      inputs: [repo, branch, files]
      outputs: [pr_number, merge_sha]
      verification: "merge_state == merged"
    - id: S9
      name: knowledge.execution.write
      gateway: obsidian-knowledge-gateway
      description: "写 execution-report（summary/metrics/artifacts，无 raw）"
      inputs: [project_id, report_data]
      outputs: [report_path]
      verification: "索引同步 + 无 raw 内容"
  templates:
    - id: "standard"
      stages: [S1, S2, S3, S4, S5, S6, S7, S7b, S8, S9]
  acceptance:
    reproducibility_check: "同一 manifest 可重复执行第二条流水线"
